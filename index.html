<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RPG謎解き</title>
  <style>
    body{font-family:system-ui, -apple-system, "Helvetica Neue", Arial; padding:24px;}
    #container{max-width:320px;margin:0 auto}
    #question{margin-bottom:12px;font-size:18px}

    /* ← ここを修正！画像サイズは #nazo img に指定する */
    #nazo img {
      width:150px; 
      height:auto;
      display:block;
      margin:0 auto;
    }

    #answer{padding:8px;width:100%;box-sizing:border-box;margin-bottom:8px}
    button{padding:8px 12px}
  </style>
</head>
<body>
  <div id="container">
    <h1>RPG謎解き</h1>

    <div id="nazo">
      <img src="katatataki.JPG" alt="問題">
    </div>

    <div id="question"></div>

    <input id="answer" type="text" placeholder="答えを入力">
    <button id="checkBtn">答える</button>

    <div id="result" style="margin-top:12px;color:#007700"></div>
  </div>

  <script>
    const nazoEl = document.getElementById('nazo');
    const questionEl = document.getElementById('question');
    const answerEl = document.getElementById('answer');
    const resultEl = document.getElementById('result');
    const checkBtn = document.getElementById('checkBtn');

    let stage = 'first';

    const sampleQuestion = {
      text: '画像の問題',
      answer: 'たぬき'
    };

    questionEl.textContent = '用いるアイテムを入力してください';

    function isKakiIdiom(input) {
      const idiomsWithKaki = ['柿', 'かき'];
      return idiomsWithKaki.includes(input.trim());
    }

    function check() {
      const given = answerEl.value.trim();

      if (!given) {
        resultEl.style.color = '#aa0000';
        resultEl.textContent = '答えを入力してください。';
        return;
      }

      if (stage === 'first') {
        if (given === sampleQuestion.answer) {
          resultEl.style.color = '#007700';
          resultEl.textContent = '';

          const img = nazoEl.querySelector('img');
          img.src = 'kaki.JPG';
          img.alt = '正解の画像';

          questionEl.textContent = '答えは？';
          answerEl.value = '';
          stage = 'second';
        } else {
          resultEl.style.color = '#aa0000';
          resultEl.textContent = '不正解です。もう一度試してください。';
        }

      } else if (stage === 'second') {
        if (isKakiIdiom(given)) {
          resultEl.style.color = '#007700';
          resultEl.textContent = '正解です！';
        } else {
          resultEl.style.color = '#aa0000';
          resultEl.textContent = '不正解です。もう一度試してください。';
        }
      }
    }

    checkBtn.addEventListener('click', check);
    answerEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
  </script>
</body>
</html>
